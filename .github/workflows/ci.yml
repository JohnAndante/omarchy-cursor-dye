name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: ShellCheck
        run: shellcheck install.sh uninstall.sh hooks/theme-set.d/50-omarchy-cursor-dye

      - name: Python syntax
        run: python3 -m py_compile bin/omarchy-cursor-dye dev/gen-cursors-spec.py

      - name: TOML files parse
        run: |
          python3 - <<'PY'
          import tomllib, glob, sys
          files = glob.glob("share/*.toml") + ["config.example.toml"]
          for f in files:
              with open(f, "rb") as fh:
                  tomllib.load(fh)
              print(f"ok  {f}")
          PY

  # End to end on a real Arch userland - the only place hyprcursor-util,
  # rsvg-convert and xcursorgen exist - against a faked-up Omarchy theme. There
  # is no Hyprland session, so apply_cursor()'s hyprctl/gsettings steps simply
  # no-op via their have() checks.
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: |
          pacman -Syu --noconfirm --needed git python hyprcursor librsvg xorg-xcursorgen xcur2png

      - uses: actions/checkout@v7

      - name: Cache Bibata cursor SVGs
        uses: actions/cache@v6
        with:
          path: ~/.local/share/omarchy-cursor-dye/svg
          key: bibata-v2.0.7

      - name: Fake an active Omarchy theme
        run: |
          state="$HOME/.local/state/omarchy/current/theme"
          mkdir -p "$state"
          echo citest > "$HOME/.local/state/omarchy/current/theme.name"

          # Also fake it as an *installed* theme the way a stock one sits in
          # /usr/share/omarchy/themes: colors.toml only, no shell.toml. That is
          # the exact shape that once made `sync <name>` lose the bar colour -
          # see the regression step below.
          src="$HOME/.config/omarchy/themes/citest"
          mkdir -p "$src"

          cat > "$state/colors.toml" <<'EOF'
          accent = "#e75a50"
          cursor = "#c0af7f"
          foreground = "#efebdc"
          background = "#1b1b1b"
          selection_foreground = "#1b1b1b"
          selection_background = "#e75a50"
          color0 = "#1b1b1b"
          color1 = "#f44336"
          color2 = "#e75a50"
          color3 = "#a99b7a"
          color4 = "#e58980"
          color5 = "#77838a"
          color6 = "#6d6d6d"
          color7 = "#e1ce98"
          EOF
          cat > "$state/shell.toml" <<'EOF'
          [bar]
          background = "#101010"
          text = "#a99b7a"
          active = "#e75a50"
          EOF

          # Same palette, source-theme style: no shell.toml alongside it.
          cp "$state/colors.toml" "$src/colors.toml"

      - name: Install (fetches Bibata, links the command, builds once)
        run: |
          ./install.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: status
        run: omarchy-cursor-dye status

      - name: Build every colour preset
        run: |
          set -e
          cfg="$(omarchy-cursor-dye config --path)"
          for preset in accent-fill accent-outline accent-fill-bar accent-outline-bar bar-fill bar-outline; do
            printf '[colors]\npreset = "%s"\n' "$preset" > "$cfg"
            omarchy-cursor-dye sync --force
          done

      # Regression for the bug where "bar" silently became accent. Plain `sync`
      # (the hook's call) must reach the real bar colour; naming the theme, which
      # cannot see the staged shell.toml, must still degrade to background.
      - name: "Regression: bar-fill never resolves to accent"
        run: |
          set -e
          cfg="$(omarchy-cursor-dye config --path)"
          printf '[colors]\npreset = "bar-fill"\n' > "$cfg"

          omarchy-cursor-dye sync --force
          base=$(omarchy-cursor-dye status | awk -F'base ' '/^colours/{print $2}' | cut -d' ' -f1)
          [ "$base" = "#101010" ] || { echo "::error::current-theme sync resolved bar-fill's fill to $base, expected #101010 (the fixture's bar colour)"; exit 1; }

          omarchy-cursor-dye sync citest --force
          base=$(omarchy-cursor-dye status | awk -F'base ' '/^colours/{print $2}' | cut -d' ' -f1)
          [ "$base" != "#e75a50" ] || { echo "::error::naming the theme leaked accent (#e75a50) into bar-fill's fill"; exit 1; }

          printf '[colors]\npreset = "accent-fill"\n' > "$cfg"
          omarchy-cursor-dye sync --force

      - name: Build every cursor style
        run: |
          set -e
          cfg="$(omarchy-cursor-dye config --path)"
          for style in modern original modern-right original-right; do
            printf '[cursor]\nstyle = "%s"\n' "$style" > "$cfg"
            omarchy-cursor-dye sync --force
          done

      - name: A bad preset/style is rejected
        run: |
          set -e
          cfg="$(omarchy-cursor-dye config --path)"
          printf '[colors]\npreset = "not-a-preset"\n' > "$cfg"
          ! omarchy-cursor-dye sync --force
          printf '[cursor]\nstyle = "not-a-style"\n' > "$cfg"
          ! omarchy-cursor-dye sync --force
          printf '[colors]\npreset = "accent-fill"\n' > "$cfg"
          omarchy-cursor-dye sync --force

      - name: Bad input fails cleanly, no traceback
        run: |
          set -e
          cfg="$(omarchy-cursor-dye config --path)"

          out=$(omarchy-cursor-dye sync --base '#gggggg' --dry-run 2>&1) && exit 1
          echo "$out" | grep -q Traceback && { echo "::error::raw traceback on bad hex"; exit 1; }

          cp "$cfg" /tmp/config.bak
          echo 'not toml [[[' > "$cfg"
          out=$(omarchy-cursor-dye status 2>&1) && { cp /tmp/config.bak "$cfg"; exit 1; }
          echo "$out" | grep -q Traceback && { echo "::error::raw traceback on malformed config.toml"; cp /tmp/config.bak "$cfg"; exit 1; }
          cp /tmp/config.bak "$cfg"

          omarchy-cursor-dye clear-cache
          out=$(omarchy-cursor-dye sync --dry-run --base '#ff5fd7' 2>&1) || { echo "::error::--dry-run failed on an uncached colour set"; echo "$out"; exit 1; }
          omarchy-cursor-dye sync --force

      - name: "Regression: refreshed artwork invalidates the cache, drift fails loudly"
        run: |
          set -e
          svg="$HOME/.local/share/omarchy-cursor-dye/svg/modern/left_ptr.svg"
          omarchy-cursor-dye sync --force

          touch "$svg"
          after=$(omarchy-cursor-dye sync 2>&1)
          echo "$after" | grep -q '^:: colours unchanged$' && { echo "::error::a touched SVG didn't invalidate the cache"; exit 1; }

          cp "$svg" /tmp/left_ptr.bak
          sed -i 's/#00FF00/#3d3d3d/gi; s/#0000FF/#c8c8c8/gi' "$svg"
          out=$(omarchy-cursor-dye sync --force 2>&1) && { echo "::error::placeholder drift built successfully instead of failing"; cp /tmp/left_ptr.bak "$svg"; exit 1; }
          echo "$out" | grep -q "no placeholder colour" || { echo "::error::wrong/missing error for placeholder drift"; echo "$out"; cp /tmp/left_ptr.bak "$svg"; exit 1; }
          cp /tmp/left_ptr.bak "$svg"
          omarchy-cursor-dye sync --force

      - name: Validate the installed theme
        run: |
          set -e
          theme=~/.local/share/icons/omarchy-dye
          test -f "$theme/manifest.hl"
          [ "$(find "$theme/hyprcursors" -name '*.hlc' | wc -l)" -gt 0 ]
          test -f "$theme/cursors/left_ptr"
          [ "$(head -c4 "$theme/cursors/left_ptr")" = "Xcur" ]
          test -L "$theme/cursors/default"

      - name: env / config --path
        run: |
          omarchy-cursor-dye env --format lua
          omarchy-cursor-dye env --format conf
          omarchy-cursor-dye config --path

      # Regression: `sync --size N` applied the size live but skipped state.json
      # when the colours were unchanged, so `status` and a later `apply` still
      # used the old size.
      - name: "Regression: sync --size persists even when colours are unchanged"
        run: |
          set -e
          omarchy-cursor-dye sync --force
          omarchy-cursor-dye sync --size 40
          got=$(omarchy-cursor-dye status | awk '/^size/{print $3}')
          [ "$got" = "40" ] || { echo "::error::status reports size $got after sync --size 40"; exit 1; }
          omarchy-cursor-dye sync --size 24 --force

      - name: Uninstall cleans up
        run: |
          set -e
          ./uninstall.sh
          test ! -e ~/.local/bin/omarchy-cursor-dye
          test ! -e ~/.local/share/icons/omarchy-dye
          test ! -e ~/.config/omarchy/hooks/theme-set.d/50-omarchy-cursor-dye
