# omarchy-cursor-dye configuration
#
# Copy to ~/.config/omarchy-cursor-dye/config.toml and edit. Every key is
# optional; the defaults shown here are what you get with no file at all.
# Run `omarchy-cursor-dye sync --force` after changing anything.

[colors]
# `preset` picks how the theme's colours land on the cursor. Four are built in:
#
#   "accent-fill"         (default) - accent fills the cursor, a computed
#                          neutral outline. Loud - reads as "the theme's colour".
#   "accent-outline"      - accent moves to the outline; the fill matches your
#                          UI text colour. Subtler, the accent is a thin edge.
#   "accent-fill-bar"     - like accent-fill, but the outline is the top bar's
#                          *actual* background (shell.toml's [bar].background)
#                          instead of a computed black/white-ish pole.
#   "accent-outline-bar"  - like accent-outline, but the fill is that same
#                          real bar colour instead of the generic foreground.
preset = "accent-fill"

# Any of the three slots below overrides that slot of the chosen preset - set
# just the one you want to change, leave the others to the preset. Each value
# is a palette key from the active Omarchy theme, a literal hex ("#ff8800"),
# or (outline only) "auto" = dark outline on light themes, light on dark,
# flipped if that pole clashes with the fill.
#
# base    = "accent"
# outline = "auto"
# watch   = "background"
#
# Palette keys you can use:
#   accent  foreground  background  cursor  selection_background
#   color0 .. color15   (color0 = darkest, usually the bg; color1..6 = the hues)
#   red green yellow blue magenta cyan  +  bright_red, bright_blue, ...
#   muted  orange  purple  brown
#   bar  bar_text  bar_active   (the top bar's own colours, from shell.toml -
#     falls back to background/foreground when a theme doesn't define its own)
# Run `omarchy-theme-color --file ~/.local/state/omarchy/current/theme/colors.toml --all`
# to see every key resolved for your current theme.

[cursor]
# Applied cursor size in px. 24 is the Omarchy default. This is written into the
# Hyprland env block by ./install.sh, so re-run it after changing the size.
size = 24
# Which Bibata cursor:
#   "modern"         rounded edges, right-handed  (default)
#   "original"       sharp edges, right-handed
#   "modern-right"   rounded edges, LEFT-handed (mirrored)
#   "original-right" sharp edges, left-handed
style = "modern"

[xcursor]
# Pixel sizes baked into the XCursor build (hyprcursor is vector, always crisp).
# More sizes = larger theme + slightly slower first build per colour set.
sizes = [24, 32, 48, 64]
# Animated shapes (progress / wait) are rendered only at these sizes to keep
# builds quick - they have 54 frames each.
anim_sizes = [24, 32]
