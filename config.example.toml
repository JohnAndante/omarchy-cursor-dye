# omarchy-cursor-dye configuration
#
# Copy to ~/.config/omarchy-cursor-dye/config.toml and edit. Every key is
# optional; the defaults shown here are what you get with no file at all.
# Run `omarchy-cursor-dye sync --force` after changing anything.

[colors]
# The cursor has three colour slots. Each value is one of:
#   - a palette key from the active Omarchy theme (see the list below)
#   - a literal hex string, e.g. "#ff8800"
#   - "auto"  (outline only)
#
# base    - the cursor fill. The colour people actually notice.
# outline - the border. "auto" = dark outline on light themes, light on dark
#           (the Bibata convention), flipped if that pole clashes with the base.
# watch   - the disc behind the loading / "app is busy" spinner.
#
# Palette keys you can use:
#   accent  foreground  background  cursor  selection_background
#   color0 .. color15   (color0 = darkest, usually the bg; color1..6 = the hues)
#   red green yellow blue magenta cyan  +  bright_red, bright_blue, ...
#   muted  orange  purple  brown
# Run `omarchy-theme-color --file ~/.local/state/omarchy/current/theme/colors.toml --all`
# to see every key resolved for your current theme.
base = "accent"
outline = "auto"
watch = "background"

[cursor]
# Applied cursor size in px. 24 is the Omarchy default. This is written into the
# Hyprland env block by ./install.sh, so re-run it after changing the size.
size = 24
# Which Bibata cursor:
#   "modern"         rounded edges, right-handed  (default)
#   "original"       sharp edges, right-handed
#   "modern-right"   rounded edges, LEFT-handed (mirrored)
#   "original-right" sharp edges, left-handed
style = "modern"

[xcursor]
# Pixel sizes baked into the XCursor build (hyprcursor is vector, always crisp).
# More sizes = larger theme + slightly slower first build per colour set.
sizes = [24, 32, 48, 64]
# Animated shapes (progress / wait) are rendered only at these sizes to keep
# builds quick - they have 54 frames each.
anim_sizes = [24, 32]
